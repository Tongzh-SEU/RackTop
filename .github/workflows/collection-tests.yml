name: Collection regression tests

on:
  push:
    branches: [codex/racktop-37-collection-timeout]
  pull_request:
    paths:
      - src/**
      - src-tauri/**
      - package.json
      - package-lock.json
      - .github/workflows/collection-tests.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: collection-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Check system OpenSSH
        run: ssh -V
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Run process cancellation regression (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path src-tauri/Cargo.toml --lib collector::tests::timed_out_ssh_command_does_not_leave_a_running_child -- --exact --nocapture 2>&1 | tee cancellation-test.log
          if ! grep -q 'test result: ok\. 1 passed; 0 failed;' cancellation-test.log; then
            echo 'The process cancellation regression did not execute and pass.' >&2
            exit 1
          fi
      - name: Run process cancellation regression (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-Command ssh | Select-Object Source
          cargo test --manifest-path src-tauri/Cargo.toml --lib collector::tests::timed_out_ssh_command_does_not_leave_a_running_child -- --exact --nocapture 2>&1 | Tee-Object -FilePath cancellation-test.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Select-String -Path cancellation-test.log -Pattern 'test result: ok\. 1 passed; 0 failed;' -Quiet)) {
            throw 'The process cancellation regression did not execute and pass.'
          }
      - run: cargo test --manifest-path src-tauri/Cargo.toml
